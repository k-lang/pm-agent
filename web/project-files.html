<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目原始资料</title>
  <link rel="stylesheet" href="/web/project-files.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div>
        <h1>项目原始资料</h1>
        <p id="project-dir">加载中...</p>
        <p id="status">加载中...</p>
      </div>
      <div id="actions">
        <button id="btn-detail" type="button">项目详情</button>
        <button id="btn-graph" type="button">项目图谱</button>
      </div>
    </header>

    <main id="layout">
      <aside id="groups"></aside>

      <section id="files-panel">
        <div id="files-toolbar">
          <input id="file-search" type="search" placeholder="搜索文件">
          <button id="btn-refresh" type="button">刷新</button>
        </div>
        <div id="file-list"></div>
      </section>

      <section id="preview-panel">
        <div id="preview-header">
          <div>
            <div id="preview-title">未选择文件</div>
            <div id="preview-path"></div>
          </div>
          <div id="preview-actions">
            <button id="btn-copy-path" type="button">复制路径</button>
            <button id="btn-copy-content" type="button">复制内容</button>
            <button id="btn-view-rendered" type="button">渲染</button>
            <button id="btn-view-source" type="button">原文</button>
          </div>
        </div>
        <div id="related-links"></div>
        <div id="preview-content"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/web/project-files.js"></script>
</body>
</html>
