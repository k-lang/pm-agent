<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <link rel="stylesheet" href="/web/project.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div>
        <h1 id="title">项目详情</h1>
        <div id="project-dir"></div>
      </div>
      <div id="header-actions">
        <button id="btn-back" class="btn-secondary">调试页</button>
        <button id="btn-rerun">重新生成总结</button>
      </div>
    </header>

    <main id="layout">
      <section id="summary-panel">
        <div class="panel-header">
          <h2>项目总结</h2>
          <div id="summary-status"></div>
        </div>
        <div id="summary-preview"></div>
        <textarea id="summary-editor" class="hidden" placeholder="总结生成后会显示在这里"></textarea>
        <div class="summary-actions">
          <button id="btn-edit-summary" class="btn-secondary">编辑总结</button>
          <button id="btn-save-summary" class="hidden">保存总结</button>
          <button id="btn-cancel-summary" class="btn-secondary hidden">取消</button>
        </div>
      </section>

      <section id="qa-panel">
        <div class="panel-header">
          <h2>项目提问</h2>
          <div id="qa-meta"></div>
        </div>

        <div id="qa-body">
          <aside id="question-history">
            <div class="subpanel-header">
              <h3>历史问题</h3>
              <div id="question-list-meta"></div>
            </div>
            <div id="question-list"></div>
          </aside>

          <section id="question-session">
            <div class="subpanel-header">
              <h3>会话内容</h3>
              <div id="process-actions">
                <button id="btn-collapse-process" class="btn-secondary">折叠中间过程</button>
                <button id="btn-expand-process" class="btn-secondary">展开中间过程</button>
              </div>
            </div>
            <div id="messages"></div>
          </section>
        </div>

        <div id="composer">
          <textarea id="question-input" rows="4" placeholder="输入你的问题..."></textarea>
          <div id="composer-actions">
            <button id="btn-ask">普通提问</button>
            <button id="btn-followup" class="btn-secondary" disabled>追问</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="source-viewer-modal" class="hidden">
    <div id="source-viewer-card">
      <div id="source-viewer-header">
        <div>
          <div id="source-viewer-title">来源文件</div>
          <div id="source-viewer-path"></div>
        </div>
        <button id="btn-close-source-viewer" class="btn-secondary">关闭</button>
      </div>
      <pre id="source-viewer-content">请选择来源文件</pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/web/project.js"></script>
</body>
</html>
