<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目图谱</title>
  <link rel="stylesheet" href="/web/project-graph-renderer.css">
  <link rel="stylesheet" href="/web/project-graph.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div>
        <h1 id="page-title">项目图谱</h1>
        <p id="project-dir">加载中...</p>
        <p id="meta">加载中...</p>
      </div>
      <div id="actions">
        <select id="project-select" aria-label="当前项目"></select>
        <button id="btn-workflow" type="button">工作推进</button>
        <button id="btn-back" type="button">项目详情</button>
        <button id="btn-files" type="button">原始资料</button>
        <button id="btn-collapsed" type="button">Collapsed</button>
        <button id="btn-expanded" type="button">Expanded</button>
      </div>
    </header>
    <main id="layout">
      <section id="canvas-panel"></section>
    </main>
  </div>
  <script type="module" src="/web/project-graph.js"></script>
</body>
</html>
