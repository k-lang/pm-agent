<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="logo">AI Assistant</span>
        <button id="btn-new">+</button>
      </div>
      <div id="project-filter-wrap">
        <select id="project-select">
          <option value="">ALL</option>
        </select>
      </div>
      <div id="session-list"></div>
    </aside>
    <div id="new-session-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title">新建对话</div>
        <label class="modal-label" for="new-session-project">项目</label>
        <select id="new-session-project"></select>
        <div id="new-project-name-wrap" class="hidden">
          <label class="modal-label" for="new-project-name">项目名</label>
          <input id="new-project-name" type="text" placeholder="输入新项目名">
        </div>
        <div id="new-session-error" class="modal-error hidden"></div>
        <div class="modal-actions">
          <button id="btn-new-session-cancel" class="btn-secondary">取消</button>
          <button id="btn-new-session-create">创建</button>
        </div>
      </div>
    </div>
    <main id="main">
      <div id="chat-header">
        <span id="chat-title">选择或新建会话</span>
        <span id="chat-dir"></span>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <textarea id="input" placeholder="输入消息..." rows="3"></textarea>
        <div id="input-btns">
          <button id="btn-send">发送</button>
          <button id="btn-abort" class="hidden">停止</button>
        </div>
      </div>
    </main>
  </div>

  <div id="source-viewer-modal" class="modal hidden">
    <div class="modal-card source-viewer-card">
      <div class="modal-title">来源文件</div>
      <div id="source-viewer-path" class="source-viewer-path"></div>
      <pre id="source-viewer-content" class="source-viewer-content">请选择来源文件</pre>
      <div class="modal-actions">
        <button id="btn-close-source-viewer" class="btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
